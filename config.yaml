name: "Theria"
description: "Smart heating optimization using electricity price-based heat capacitor strategy"
version: "0.7.0"
image: "ghcr.io/johanzander/theria-{arch}"

slug: "theria"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  8081/tcp: 8081
ingress: true
ingress_port: 8081
panel_icon: mdi:radiator
panel_title: Theria
panel_admin: true
hassio_api: true
homeassistant_api: true
auth_api: true

options:
  sensors:
    outdoor_temp: "sensor.outdoor"  # H60 outdoor temperature sensor

  influxdb:
    enabled: true
    # The same url, username and password as the home-analytics add-on (InfluxQL, GET /query).
    # Fill in username and password in the add-on options. Locally, empty values fall back to
    # HA_DB_URL / HA_DB_USER_NAME / HA_DB_PASSWORD / HA_DB_BUCKET in .env.
    url: "http://192.168.2.9:8086/query"
    username: ""
    password: ""
    bucket: "home_assistant/autogen"  # database/retention policy, as in home-analytics

  heat_pump:
    enabled: true
    # IVT AirX via Husdata H60 - entity IDs confirmed against home-analytics/backend/sensors.yaml
    compressor_speed: "sensor.compressor_speed"  # % of max
    compressor_power: "sensor.compressor_speed_2"  # kW, instantaneous
    mode_switch: "binary_sensor.switch_valve_1"  # True=hot water, False=heating
    heat_carrier_forward: "sensor.heat_carrier_forwrd"
    heat_carrier_return: "sensor.heat_carrier_return"
    compressor_consumption_total: "sensor.compr_consump_tot"  # kWh, cumulative
    compressor_consumption_heating: "sensor.compr_cons_heating"  # kWh, cumulative
    compressor_consumption_hotwater: "sensor.compr_cons_hotwat"  # kWh, cumulative
    delivered_energy_total: "sensor.supp_energy_tot"  # kWh, cumulative
    delivered_energy_heating: "sensor.supp_energy_heating"  # kWh, cumulative
    delivered_energy_hotwater: "sensor.supp_energy_hotwater"  # kWh, cumulative
    aux_consumption_total: "sensor.aux_consumption_tot"  # kWh, cumulative
    hotwater_setpoint: "sensor.warm_water_setpoint"
    hotwater_top: "sensor.warm_water_1_top"
    hotwater_mid: "sensor.warm_water_2_mid"

  plan:
    mode: "shadow"  # Shadow computes and logs plans, never writes to HA; active is switched on in the UI.
    # The only price source: the HA Nord Pool integration (nordpool.get_prices_for_date), for the plan and the measured days.
    price_config_entry: "01K3Y99FD3MDZYVFX2XSWR4888"
    price_area: "SE4"
    outdoor_entity: "sensor.outdoor"
    room_setpoint_entity: "climate.room_temp_setpoint"
    flow_setpoint_entity: "sensor.heating_setpoint"
    room_temp_entities:
      - "sensor.lk_bibliotek_temperature"
      - "sensor.lk_vardagsrum_temperature"
    room_thermostat_entities:
      - "climate.lk_bibliotek_thermostat"
      - "climate.lk_vardagsrum_thermostat"
    room_actuators:  # LK floor loops, on = open (ha-lksystems)
      - room: "vardagsrum"
        entities:
          - "binary_sensor.lk_vardagsrum_actuator_7"
          - "binary_sensor.lk_vardagsrum_actuator_9"
          - "binary_sensor.lk_vardagsrum_actuator_11"
      - room: "bibliotek"
        entities:
          - "binary_sensor.lk_bibliotek_actuator_4"
          - "binary_sensor.lk_bibliotek_actuator_6"
          - "binary_sensor.lk_bibliotek_actuator_8"
          - "binary_sensor.lk_bibliotek_actuator_10"
          - "binary_sensor.lk_bibliotek_actuator_12"
    plan_closes_valves: true  # true: the plan may close the floor loops in dear hours (LK thermostats held at the floor); false: they stay at the limit
    room_history_entities:  # older sensors that extend the room history back before the LK sensors
      - "sensor.sonoff_a480045bf5_temperature"
    heating_mode_entity: "binary_sensor.switch_valve_1"
    flow_measured_entity: "sensor.radiator_forward"
    energy_counter_entity: "sensor.compr_cons_heating"
    aux_energy_entity: "sensor.aux_cons_heating"
    aux_status_entity: "sensor.add_heat_status"
    latitude: 55.578
    longitude: 12.927
    floor_mix_max_c: 40.0  # what the floor mixing valves (shunts) let through to the floor loops
    lk_base_c: 19.5  # the LK setting when Theria does not control the thermostats
    # Comfort is wanted 06:00-24:00 local time; nobody is in the ground floor at night, so the
    # room may be cooler then. Set night_start_hour = night_end_hour to switch the window off.
    night_start_hour: 0
    night_end_hour: 6
    night_target_c: 18.5
    night_floor_c: 17.5

  sensor_guard:
    # Watches the comfort sensors (silence, battery, signal, agreement) and tells the plan
    # which ones to trust. Problems become Home Assistant notifications (the bell).
    notify: true
    # The Sonoff comparison sensors are left out while their batteries are flat (2026-11-10).
    sensors:
      - name: "Vardagsrum LK"
        room: "vardagsrum"
        temperature_entity: "sensor.lk_vardagsrum_temperature"
        battery_entity: "sensor.lk_vardagsrum_battery"
        signal_entity: "sensor.lk_vardagsrum_rssi"
        reference: true  # the sensor LK regulates on
        silent_warn_minutes: 480
        silent_fault_minutes: 960
      - name: "Bibliotek LK"
        room: "bibliotek"
        temperature_entity: "sensor.lk_bibliotek_temperature"
        battery_entity: "sensor.lk_bibliotek_battery"
        signal_entity: "sensor.lk_bibliotek_rssi"
        reference: true
        silent_warn_minutes: 480
        silent_fault_minutes: 960

  radiators:
    # Salon (Netatmo) and guest house (Tado) radiator control. Shadow only: it computes and logs what it
    # would write to the thermostats and never writes.
    salon_thermostats:
      - "climate.vantsidan"
      - "climate.klippsidan"
    salon_sensors:  # the Verisure points: water alarm on the floor, smoke detector in the ceiling
      - "sensor.schamponeringstolen_temperature"
      - "sensor.butik_temperature_2"  # probably the smoke detector (ceiling); to be confirmed
    outdoor_entity: "sensor.outdoor"
    salon_sensor_guard:  # a guard of its own: the plan's guard corrects sensors to a reference and averages rooms
      notify: false
      sensors:
        - name: "Vantsidan"
          room: "salon"
          temperature_entity: "sensor.vantsidan_temperature"
          reference: true
        - name: "Klippsidan"
          room: "salon"
          temperature_entity: "sensor.klippsidan_temperature"
        - name: "Vattenlarm (golv)"
          room: "salon"
          temperature_entity: "sensor.schamponeringstolen_temperature"
        - name: "Brandvarnare (tak)"
          room: "salon"
          temperature_entity: "sensor.butik_temperature_2"
    defaults:  # what the UI starts from; changes made there are saved separately
      mode: "shadow"
      guest_band_c: 1.5
      guest_rooms:
        - entity: "climate.bedroom"
          t_room_c: 18.0
        - entity: "climate.hallway"
          t_room_c: 19.5
        - entity: "climate.kitchen"
          t_room_c: 20.0
        - entity: "climate.tv_room_gh"
          t_room_c: 19.5
        - entity: "climate.storage_room"
          t_room_c: 17.0

  room_sections:
    # The house as the dashboard shows it (the HA climate view): each section's rooms on a chart of their
    # own, and its thermostats' setpoints and heat demand. Display only, the plan does not read these.
    # The charts draw the plan's own lines on the sections with id "ground" (the LK rooms) and "salon".
    - id: "salon"
      name: "Salong"
      rooms:
        - { name: "Klippsidan", entity: "sensor.klippsidan_temperature" }
        - { name: "Väntsidan", entity: "sensor.vantsidan_temperature" }
        - { name: "Brandvarnare", entity: "sensor.butik_temperature_2" }
        - { name: "Vattenlarm", entity: "sensor.schamponeringstolen_temperature" }
      thermostats:  # Netatmo: heat demand is the climate entity's heating_power_request
        - { name: "Klippsidan", entity: "climate.klippsidan", demand_entity: "climate.klippsidan", demand_field: "heating_power_request" }
        - { name: "Väntsidan", entity: "climate.vantsidan", demand_entity: "climate.vantsidan", demand_field: "heating_power_request" }
    - id: "ground"
      name: "Bottenvåning"
      rooms:
        - { name: "Hallen", entity: "sensor.hallen_temperature_2" }
        - { name: "Kök", entity: "sensor.kok_temperature" }
        - { name: "Gästrum", entity: "sensor.gastrum_temperature_2" }
        - { name: "Bibliotek", entity: "sensor.lk_bibliotek_temperature" }
        - { name: "Vardagsrum", entity: "sensor.lk_vardagsrum_temperature" }
      thermostats: []
    - id: "guest"
      name: "Gårdshus"
      rooms:
        - { name: "Sovrum", entity: "sensor.bedroom_temperature" }
        - { name: "Hall", entity: "sensor.hallway_temperature" }
        - { name: "Vardagsrum", entity: "sensor.tv_room_gh_temperature" }
        - { name: "Kök", entity: "sensor.kitchen_temperature" }
        - { name: "Tvättstuga", entity: "sensor.storage_room_temperature" }
      thermostats:  # Tado: heat demand is the zone's heating sensor (%)
        - { name: "Sovrum", entity: "climate.bedroom", demand_entity: "sensor.bedroom_heating" }
        - { name: "Hall", entity: "climate.hallway", demand_entity: "sensor.hallway_heating" }
        - { name: "Vardagsrum", entity: "climate.tv_room_gh", demand_entity: "sensor.tv_room_gh_heating" }
        - { name: "Kök", entity: "climate.kitchen", demand_entity: "sensor.kitchen_heating" }
        - { name: "Tvättstuga", entity: "climate.storage_room", demand_entity: "sensor.storage_room_heating" }
    - id: "upper"
      name: "Ovanvåning"
      rooms:
        - { name: "Sovrum", entity: "sensor.master_sovrum_temperature_2" }
        - { name: "Tages rum", entity: "sensor.tages_rum_temperature_2" }
        - { name: "Egons rum", entity: "sensor.egons_rum_temperature_2" }
        - { name: "Korridor", entity: "sensor.korridor_vaning_2_temperature_2" }
      thermostats: []
  zones:
    - id: "butik"
      name: "Butik"
      icon: "🏪"
      climate_entities:
        - "climate.vantsidan"
        - "climate.klippsidan"
      temp_sensors:
        - "climate.vantsidan"
        - "climate.klippsidan"
        - "sensor.schamponeringstolen_temperature"
        - "sensor.butik_temperature_2"
      comfort_target: 21.0  # Target comfort temperature (°C)
      allowed_deviation: 1.0  # Allowed temperature variation for savings (±°C)
      enabled: true

    - id: "first_floor"
      name: "First Floor"
      icon: "🏠"
      climate_entities:
        - "climate.lk_bibliotek_thermostat"
        - "climate.lk_vardagsrum_thermostat"
      temp_sensors:
        - "sensor.lk_bibliotek_temperature"
        - "sensor.lk_vardagsrum_temperature"
        - "sensor.gastrum_temperature_2"
      comfort_target: 22.0  # Target comfort temperature (°C)
      allowed_deviation: 1.0  # Allowed temperature variation for savings (±°C)
      enabled: true

schema:
  sensors:
    outdoor_temp: str?
  influxdb:
    enabled: bool?
    url: str?
    username: str?
    password: str?
    bucket: str?
  heat_pump:
    enabled: bool?
    compressor_speed: str?
    compressor_power: str?
    mode_switch: str?
    heat_carrier_forward: str?
    heat_carrier_return: str?
    compressor_consumption_total: str?
    compressor_consumption_heating: str?
    compressor_consumption_hotwater: str?
    delivered_energy_total: str?
    delivered_energy_heating: str?
    delivered_energy_hotwater: str?
    aux_consumption_total: str?
    hotwater_setpoint: str?
    hotwater_top: str?
    hotwater_mid: str?
  plan:
    mode: list(shadow)
    price_config_entry: str
    price_area: str?
    outdoor_entity: str
    room_setpoint_entity: str
    flow_setpoint_entity: str
    room_temp_entities:
      - str
    room_thermostat_entities:
      - str
    room_history_entities:
      - str
    room_actuators:
      - room: str
        entities:
          - str
    plan_closes_valves: bool?
    heating_mode_entity: str
    flow_measured_entity: str
    energy_counter_entity: str
    aux_energy_entity: str
    aux_status_entity: str
    latitude: float
    longitude: float
    floor_mix_max_c: float?
    lk_base_c: float?
    min_authority: float?
    night_start_hour: int?
    night_end_hour: int?
    night_target_c: float?
    night_floor_c: float?
  sensor_guard:
    notify: bool?
    sensors:
      - name: str
        room: str
        temperature_entity: str
        battery_entity: str?
        signal_entity: str?
        reference: bool?
        silent_warn_minutes: int?
        silent_fault_minutes: int?
  radiators:
    salon_thermostats:
      - str
    salon_sensors:
      - str
    outdoor_entity: str
    salon_sensor_guard:
      notify: bool?
      sensors:
        - name: str
          room: str
          temperature_entity: str
          battery_entity: str?
          signal_entity: str?
          reference: bool?
          silent_warn_minutes: int?
          silent_fault_minutes: int?
    defaults:
      mode: list(off|shadow)
      guest_band_c: float?
      guest_rooms:
        - entity: str
          t_room_c: float
          band_c: float?
    timezone: str?
    salon_c_j_per_k: float?
    salon_u_w_per_k: float?
    salon_heat_power_w: float?
    salon_baseline_c: float?
    guest_loss_w_per_k: float?
  room_sections:
    - id: str
      name: str
      rooms:
        - name: str
          entity: str
      thermostats:
        - name: str
          entity: str
          demand_entity: str
          demand_field: str?
  zones:
    - id: str
      name: str
      icon: str?
      climate_entities:
        - str
      temp_sensors:
        - str
      comfort_target: float
      allowed_deviation: float
      enabled: bool?
