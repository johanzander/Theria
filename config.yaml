name: "Theria"
description: "Smart heating optimization using electricity price-based heat capacitor strategy"
version: "0.7.0"
image: "ghcr.io/johanzander/theria-{arch}"

slug: "theria"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ports:
  8081/tcp: 8081
ingress: true
ingress_port: 8081
panel_icon: mdi:radiator
panel_title: Theria
panel_admin: true
hassio_api: true
homeassistant_api: true
auth_api: true

options:
  sensors:
    nordpool_price: "sensor.nord_pool_se4_current_price"
    outdoor_temp: "sensor.outdoor"  # H60 outdoor temperature sensor

  influxdb:
    enabled: true
    # The same url, username and password as the home-analytics add-on (InfluxQL, GET /query).
    # Fill in username and password in the add-on options. Locally, empty values fall back to
    # HA_DB_URL / HA_DB_USER_NAME / HA_DB_PASSWORD / HA_DB_BUCKET in .env.
    url: "http://192.168.2.9:8086/query"
    username: ""
    password: ""
    bucket: "home_assistant/autogen"  # database/retention policy, as in home-analytics

  price_optimization:
    enabled: true
    price_sensor: "nordpool_price"
    expensive_hours: 4  # Number of most expensive hours to avoid heating
    cheap_hours: 4  # Number of cheapest hours to pre-heat
    adjustment_degrees: 0.5  # Temperature adjustment in °C

  heat_pump:
    enabled: true
    # IVT AirX via Husdata H60 - entity IDs confirmed against home-analytics/backend/sensors.yaml
    compressor_speed: "sensor.compressor_speed"  # % of max
    compressor_power: "sensor.compressor_speed_2"  # kW, instantaneous
    mode_switch: "binary_sensor.switch_valve_1"  # True=hot water, False=heating
    heat_carrier_forward: "sensor.heat_carrier_forwrd"
    heat_carrier_return: "sensor.heat_carrier_return"
    compressor_consumption_total: "sensor.compr_consump_tot"  # kWh, cumulative
    compressor_consumption_heating: "sensor.compr_cons_heating"  # kWh, cumulative
    compressor_consumption_hotwater: "sensor.compr_cons_hotwat"  # kWh, cumulative
    delivered_energy_total: "sensor.supp_energy_tot"  # kWh, cumulative
    delivered_energy_heating: "sensor.supp_energy_heating"  # kWh, cumulative
    delivered_energy_hotwater: "sensor.supp_energy_hotwater"  # kWh, cumulative
    aux_consumption_total: "sensor.aux_consumption_tot"  # kWh, cumulative
    hotwater_setpoint: "sensor.warm_water_setpoint"
    hotwater_top: "sensor.warm_water_1_top"
    hotwater_mid: "sensor.warm_water_2_mid"

  plan:
    mode: "shadow"  # off | shadow. Shadow computes and logs plans, never writes to HA.
    price_entity: "sensor.nord_pool_se4_current_price"  # price history; SEK/kWh
    price_config_entry: "01K3Y99FD3MDZYVFX2XSWR4888"  # HA Nord Pool integration (nordpool.get_prices_for_date)
    price_area: "SE4"
    outdoor_entity: "sensor.outdoor"
    room_setpoint_entity: "climate.room_temp_setpoint"
    flow_setpoint_entity: "sensor.heating_setpoint"
    room_temp_entities:
      - "sensor.lk_bibliotek_temperature"
      - "sensor.lk_vardagsrum_temperature"
    room_thermostat_entities:
      - "climate.lk_bibliotek_thermostat"
      - "climate.lk_vardagsrum_thermostat"
    room_actuators:  # LK floor loops, on = open (ha-lksystems)
      - room: "vardagsrum"
        entities:
          - "binary_sensor.lk_vardagsrum_actuator_7"
          - "binary_sensor.lk_vardagsrum_actuator_9"
          - "binary_sensor.lk_vardagsrum_actuator_11"
      - room: "bibliotek"
        entities:
          - "binary_sensor.lk_bibliotek_actuator_4"
          - "binary_sensor.lk_bibliotek_actuator_6"
          - "binary_sensor.lk_bibliotek_actuator_8"
          - "binary_sensor.lk_bibliotek_actuator_10"
          - "binary_sensor.lk_bibliotek_actuator_12"
    room_history_entities:  # older sensors that extend the room history back before the LK sensors
      - "sensor.sonoff_a480045bf5_temperature"
    heating_mode_entity: "binary_sensor.switch_valve_1"
    flow_measured_entity: "sensor.radiator_forward"
    energy_counter_entity: "sensor.compr_cons_heating"
    aux_energy_entity: "sensor.aux_cons_heating"
    aux_status_entity: "sensor.add_heat_status"
    latitude: 55.578
    longitude: 12.927
    max_flow_c: 45.0  # LK's design flow temperature (LK023393); a sanity bound on the pump flow
    floor_mix_max_c: 40.0  # what the floor mixing valves (shunts) let through to the floor loops
    ceiling_c: 22.0  # the room limit; the LK thermostats are held here in active mode
    lk_limit_c: 22.0
    lk_base_c: 19.5  # the LK setting when Theria does not control the thermostats
    # Comfort is wanted 06:00-24:00 local time; nobody is in the ground floor at night, so the
    # room may be cooler then. Set night_start_hour = night_end_hour to switch the window off.
    night_start_hour: 0
    night_end_hour: 6
    night_target_c: 18.5
    night_floor_c: 17.5

  sensor_guard:
    # Watches the comfort sensors (silence, battery, signal, agreement) and tells the plan
    # which ones to trust. Problems become Home Assistant notifications (the bell).
    notify: true
    sensors:
      - name: "Vardagsrum LK"
        room: "vardagsrum"
        temperature_entity: "sensor.lk_vardagsrum_temperature"
        battery_entity: "sensor.lk_vardagsrum_battery"
        signal_entity: "sensor.lk_vardagsrum_rssi"
        reference: true  # the sensor LK regulates on
        silent_warn_minutes: 480
        silent_fault_minutes: 960
      - name: "Vardagsrum Sonoff"
        room: "vardagsrum"
        temperature_entity: "sensor.sonoff_a480045bf5_temperature"
        battery_entity: "sensor.sonoff_a480045bf5_battery"
        silent_warn_minutes: 360
        silent_fault_minutes: 720
      - name: "Bibliotek LK"
        room: "bibliotek"
        temperature_entity: "sensor.lk_bibliotek_temperature"
        battery_entity: "sensor.lk_bibliotek_battery"
        signal_entity: "sensor.lk_bibliotek_rssi"
        reference: true
        silent_warn_minutes: 480
        silent_fault_minutes: 960
      - name: "Bibliotek Sonoff"
        room: "bibliotek"
        temperature_entity: "sensor.sonoff_a480050818_temperature"
        battery_entity: "sensor.sonoff_a480050818_battery"
        silent_warn_minutes: 360
        silent_fault_minutes: 720

  zones:
    - id: "butik"
      name: "Butik"
      icon: "🏪"
      climate_entities:
        - "climate.vantsidan"
        - "climate.klippsidan"
      temp_sensors:
        - "climate.vantsidan"
        - "climate.klippsidan"
        - "sensor.schamponeringstolen_temperature"
        - "sensor.butik_temperature_2"
      comfort_target: 21.0  # Target comfort temperature (°C)
      allowed_deviation: 1.0  # Allowed temperature variation for savings (±°C)
      enabled: true

    - id: "first_floor"
      name: "First Floor"
      icon: "🏠"
      climate_entities:
        - "climate.lk_bibliotek_thermostat"
        - "climate.lk_vardagsrum_thermostat"
      temp_sensors:
        - "sensor.lk_bibliotek_temperature"
        - "sensor.lk_vardagsrum_temperature"
        - "sensor.sonoff_a480045bf5_temperature"
        - "sensor.gastrum_temperature_2"
      comfort_target: 22.0  # Target comfort temperature (°C)
      allowed_deviation: 1.0  # Allowed temperature variation for savings (±°C)
      enabled: true

schema:
  sensors:
    nordpool_price: str?
    outdoor_temp: str?
  influxdb:
    enabled: bool?
    url: str?
    username: str?
    password: str?
    bucket: str?
  price_optimization:
    enabled: bool?
    price_sensor: str?
    expensive_hours: int?
    cheap_hours: int?
    adjustment_degrees: float?
  heat_pump:
    enabled: bool?
    compressor_speed: str?
    compressor_power: str?
    mode_switch: str?
    heat_carrier_forward: str?
    heat_carrier_return: str?
    compressor_consumption_total: str?
    compressor_consumption_heating: str?
    compressor_consumption_hotwater: str?
    delivered_energy_total: str?
    delivered_energy_heating: str?
    delivered_energy_hotwater: str?
    aux_consumption_total: str?
    hotwater_setpoint: str?
    hotwater_top: str?
    hotwater_mid: str?
  plan:
    mode: list(off|shadow)
    price_entity: str
    price_config_entry: str?
    price_area: str?
    outdoor_entity: str
    room_setpoint_entity: str
    flow_setpoint_entity: str
    room_temp_entities:
      - str
    room_thermostat_entities:
      - str
    room_history_entities:
      - str
    room_actuators:
      - room: str
        entities:
          - str
    heating_mode_entity: str
    flow_measured_entity: str
    energy_counter_entity: str
    aux_energy_entity: str
    aux_status_entity: str
    latitude: float
    longitude: float
    max_flow_c: float?
    floor_mix_max_c: float?
    ceiling_c: float?
    lk_limit_c: float?
    lk_base_c: float?
    min_saving_sek: float?
    night_start_hour: int?
    night_end_hour: int?
    night_target_c: float?
    night_floor_c: float?
  sensor_guard:
    notify: bool?
    sensors:
      - name: str
        room: str
        temperature_entity: str
        battery_entity: str?
        signal_entity: str?
        reference: bool?
        silent_warn_minutes: int?
        silent_fault_minutes: int?
  zones:
    - id: str
      name: str
      icon: str?
      climate_entities:
        - str
      temp_sensors:
        - str
      comfort_target: float
      allowed_deviation: float
      enabled: bool?
